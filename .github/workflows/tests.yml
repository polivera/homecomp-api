name: Tests

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # Allow manual trigger from GitHub UI

# Cancel in-progress runs when a new one starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Run on all non-draft PRs and manual triggers
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

  unit-tests:
    # Run on all non-draft PRs (both dev and main) and manual triggers
    if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest -m unit --ignore=tests/integration --tb=short

      - name: Upload coverage to artifacts (optional)
        if: always()
        run: |
          uv run pytest -m unit --ignore=tests/integration --cov --cov-report=xml --cov-report=term
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
        continue-on-error: true

  integration-tests:
    # Run ONLY on PRs targeting main (not dev) or manual triggers
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.base_ref == 'main') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: uhomecomp
      TEST_DB_PASS: homecomppass
      TEST_DB_NAME: homecomp_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uhomecomp
          POSTGRES_PASSWORD: homecomppass
          POSTGRES_DB: homecomp_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest -m integration --tb=short
